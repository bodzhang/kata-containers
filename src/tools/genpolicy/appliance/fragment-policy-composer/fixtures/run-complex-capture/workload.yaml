apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: balanced-mode
  ports:
    - name: https
      port: 8443
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: balanced-mode-config
data:
  LOG_LEVEL: info
  FEATURE_MODE: safe
---
apiVersion: v1
kind: Secret
metadata:
  name: balanced-mode-secret
data:
  API_TOKEN: dGVzdC1vbmx5LXRva2Vu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: balanced-mode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: balanced-mode
  template:
    metadata:
      labels:
        app: balanced-mode
    spec:
      automountServiceAccountToken: false
      runtimeClassName: kata
      containers:
        - name: workload
          image: genpolicy.local:5000/busybox@sha256:c0aae9d756395ade52df06b55e160e6e32d2ecfe0181ed2c14c68effc5e3fe45
          imagePullPolicy: Never
          workingDir: /work
          command: ["/bin/busybox"]
          args: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef:
                name: balanced-mode-config
            - secretRef:
                name: balanced-mode-secret
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          readinessProbe:
            exec:
              command: ["/bin/busybox", "true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: sidecar
          image: genpolicy.local:5000/busybox@sha256:c0aae9d756395ade52df06b55e160e6e32d2ecfe0181ed2c14c68effc5e3fe45
          imagePullPolicy: Never
          command: ["/bin/busybox", "sleep", "3600"]
