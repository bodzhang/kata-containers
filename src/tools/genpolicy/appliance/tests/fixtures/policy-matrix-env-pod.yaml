apiVersion: v1
kind: ConfigMap
metadata:
  name: policy-matrix-config
data:
  LOG_LEVEL: info
  FEATURE_MODE: safe
---
apiVersion: v1
kind: Secret
metadata:
  name: policy-matrix-secret
data:
  API_TOKEN: dGVzdC1vbmx5LXRva2Vu
---
apiVersion: v1
kind: Pod
metadata:
  name: policy-matrix-env
spec:
  automountServiceAccountToken: false
  runtimeClassName: kata
  securityContext:
    supplementalGroups:
      - 10
  containers:
    - name: workload
      image: genpolicy.local:5000/busybox@sha256:c0aae9d756395ade52df06b55e160e6e32d2ecfe0181ed2c14c68effc5e3fe45
      imagePullPolicy: Never
      command: ["/bin/busybox", "sleep", "3600"]
      envFrom:
        - configMapRef:
            name: policy-matrix-config
        - secretRef:
            name: policy-matrix-secret
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
