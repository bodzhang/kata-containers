apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-boundary-config
data:
  mode: test
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-boundary
spec:
  runtimeClassName: kata
  restartPolicy: Never
  containers:
    - name: workload
      image: genpolicy.local:5000/busybox@sha256:c0aae9d756395ade52df06b55e160e6e32d2ecfe0181ed2c14c68effc5e3fe45
      imagePullPolicy: Never
      command: ["/bin/busybox", "sleep", "3600"]
      volumeMounts:
        - name: cache
          mountPath: /cache
        - name: configuration
          mountPath: /configuration
          readOnly: true
        - name: host-data
          mountPath: /external-data
        - name: host-device
          mountPath: /external-device
  volumes:
    - name: cache
      emptyDir: {}
    - name: configuration
      configMap:
        name: storage-boundary-config
    - name: host-data
      hostPath:
        path: /var/lib/genpolicy-external-data
        type: DirectoryOrCreate
    - name: host-device
      hostPath:
        path: /dev/null
        type: CharDevice
