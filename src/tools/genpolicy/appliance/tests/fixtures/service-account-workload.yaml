apiVersion: v1
kind: Pod
metadata:
  name: service-account-workload
spec:
  runtimeClassName: kata
  serviceAccountName: workload-identity
  automountServiceAccountToken: false
  securityContext:
    supplementalGroups: [10]
  restartPolicy: Never
  containers:
    - name: workload
      image: genpolicy.local:5000/busybox@sha256:c0aae9d756395ade52df06b55e160e6e32d2ecfe0181ed2c14c68effc5e3fe45
      imagePullPolicy: Never
      command: ["/bin/busybox", "sleep", "3600"]
      env:
        - name: SERVICE_ACCOUNT_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
