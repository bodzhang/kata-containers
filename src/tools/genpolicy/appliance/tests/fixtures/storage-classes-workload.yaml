apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-classes-config
data:
  app.conf: |
    log_level=info
    mode=safe
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-classes-secret
data:
  token: dGVzdC1vbmx5LXRva2Vu
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-classes
spec:
  runtimeClassName: kata
  restartPolicy: Never
  securityContext:
    fsGroup: 2000
  containers:
    - name: workload
      image: genpolicy.local:5000/busybox@sha256:c0aae9d756395ade52df06b55e160e6e32d2ecfe0181ed2c14c68effc5e3fe45
      imagePullPolicy: Never
      command: ["/bin/busybox", "sleep", "3600"]
      volumeMounts:
        - name: scratch-memory
          mountPath: /scratch-memory
        - name: scratch-disk
          mountPath: /scratch-disk
        - name: configuration
          mountPath: /etc/configuration
          readOnly: true
        - name: secret
          mountPath: /etc/secret
          readOnly: true
        - name: podinfo
          mountPath: /etc/podinfo
          readOnly: true
  volumes:
    - name: scratch-memory
      emptyDir:
        medium: Memory
    - name: scratch-disk
      emptyDir: {}
    - name: configuration
      configMap:
        name: storage-classes-config
    - name: secret
      secret:
        secretName: storage-classes-secret
    - name: podinfo
      downwardAPI:
        items:
          - path: name
            fieldRef:
              fieldPath: metadata.name
