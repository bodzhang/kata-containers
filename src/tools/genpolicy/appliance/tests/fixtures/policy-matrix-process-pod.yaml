apiVersion: v1
kind: Pod
metadata:
  name: policy-matrix-process
  annotations:
    io.katacontainers.config.hypervisor.default_vcpus: "2"
spec:
  runtimeClassName: kata
  restartPolicy: Never
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups:
      - 10
  containers:
    - name: workload
      image: genpolicy.local:5000/busybox@sha256:c0aae9d756395ade52df06b55e160e6e32d2ecfe0181ed2c14c68effc5e3fe45
      imagePullPolicy: Never
      workingDir: /work
      command: ["/bin/busybox"]
      args: ["sleep", "3600"]
      stdin: true
      tty: true
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: STATIC_VALUE
          value: legacy-containerd-1.7
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - NET_RAW
