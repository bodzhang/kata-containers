apiVersion: v1
kind: Pod
metadata:
  name: tagged-oci-test
spec:
  runtimeClassName: kata
  containers:
    - name: workload
      image: genpolicy.local:5000/busybox:1.36.1
      imagePullPolicy: Never
      workingDir: /work
      command:
        - /bin/busybox
      args:
        - sleep
        - "3600"
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
