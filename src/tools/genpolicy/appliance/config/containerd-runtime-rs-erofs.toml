version = 4
root = "/var/lib/containerd"
state = "/run/containerd"

[grpc]
  address = "/run/containerd/containerd.sock"

[plugins."io.containerd.transfer.v1.local"]
  [[plugins."io.containerd.transfer.v1.local".unpack_config]]
    platform = "linux/amd64"
    snapshotter = "erofs"
    differ = "erofs"

[plugins."io.containerd.cri.v1.images"]
  snapshotter = "erofs"

  [plugins."io.containerd.cri.v1.images".runtime_platforms.runc]
    platform = "linux/amd64"
    snapshotter = "native"

  [plugins."io.containerd.cri.v1.images".runtime_platforms.kata]
    platform = "linux/amd64"
    snapshotter = "erofs"

  [plugins."io.containerd.cri.v1.images".pinned_images]
    sandbox = "genpolicy.local:5000/pause:3.10"

  [plugins."io.containerd.cri.v1.images".registry]
    config_path = "/etc/containerd/certs.d"

[plugins."io.containerd.cri.v1.runtime"]
  [plugins."io.containerd.cri.v1.runtime".cni]
    bin_dirs = ["/opt/cni/bin"]
    conf_dir = "/etc/cni/net.d"

  [plugins."io.containerd.cri.v1.runtime".containerd]
    default_runtime_name = "runc"

    [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc]
      runtime_type = "io.containerd.runc.v2"

      [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc.options]
        BinaryName = "/usr/local/bin/runc-capture"
        SystemdCgroup = false

    [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata]
      runtime_type = "io.containerd.kata-capture.v2"

[plugins."io.containerd.differ.v1.erofs"]
  mkfs_options = ["-T0", "--mkfs-time", "--sort=none"]
  enable_tar_index = false
  enable_dmverity = true

[plugins."io.containerd.snapshotter.v1.erofs"]
  default_size = "10G"
  enable_fsverity = false
  dmverity_mode = "on"

[plugins."io.containerd.service.v1.diff-service"]
  default = ["erofs", "walking"]