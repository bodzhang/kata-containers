apiVersion: v1
kind: Pod
metadata:
  name: working-dir-test
spec:
  securityContext:
    supplementalGroups:
      - 10
  containers:
    - name: workload
      image: quay.io/prometheus/busybox:latest
      workingDir: /work
      command:
        - /bin/busybox
      args:
        - sleep
        - "3600"
