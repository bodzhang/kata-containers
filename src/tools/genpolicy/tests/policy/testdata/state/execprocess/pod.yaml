apiVersion: v1
kind: Pod
metadata:
  name: busybox
spec:
  runtimeClassName: kata-cc
  containers:
    - name: first-test-container
      image: "quay.io/prometheus/busybox:latest"
      env:
        - name: CONTAINER_NAME
          value: first-test-container
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      command:
        - sleep
        - "3600"
      livenessProbe:
        exec:
          command:
            - test1
    - name: second-test-container
      image: "quay.io/prometheus/busybox:latest"
      env:
        - name: CONTAINER_NAME
          value: second-test-container
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      command:
        - sleep
        - "3600"
      livenessProbe:
        exec:
          command:
            - test2
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups:
      - 10
