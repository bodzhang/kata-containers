apiVersion: apps/v1
kind: Deployment
metadata:
  name: execprocessnamed
spec:
  selector:
    matchLabels:
      app: execprocessnamed
  template:
    metadata:
      labels:
        app: execprocessnamed
    spec:
      runtimeClassName: kata
      containers:
      - name: execprocessnamed
        image: "quay.io/prometheus/busybox@sha256:0a95bb8f4faff91409f980e9a497e48a3bddc6ba093c493a042fd4748d3edbf5"
        command:
          - sleep
          - "3600"
        readinessProbe:
          exec:
            command:
              - /bin/true

      securityContext:
        runAsUser: 0
        runAsGroup: 0
        supplementalGroups:
          - 10
